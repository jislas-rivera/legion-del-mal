# This is a basic workflow to help you get started with Actions

name: Comunicador de la Legión.

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs:
      villano:
        description: "Que villano envia el mensaje"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Joker
          - Thanos
          - Magneto
          - Brainiac
      mensaje:
        description: "Mensaje para el consejo"
        required: true
        default: "La mision fue un exito"

      prioridad:
        description: "Nivel de prioridad"
        required: true
        type: choice
        options:
          - 🟢 Normal
          - 🟡 Alta
          - 🔴 Critica
      
      cowsay:
        description: "Estilo de transmision"
        required: true
        type: choice
        options:
          - eyes
          - dragon
          - ghostbusters


jobs:
  trasnmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar el transmisor de la Legion
        run: sudo apt-get install -y cowsay

      - name: Imprimir inputs
        run: |
          echo "================================"
          echo "Transmision interceptada"
          echo ""
          echo ""
          echo "De: ${{inputs.villano}}"
          echo ""
          echo "Fecha: $(date -u + "%d/%m/%Y - %H:%M UTC")"
          echo "------- Mensaje --------"
          cowsay -f ${{inputs.cowsay}} "${{inputs.mensaje}}"
          echo ""
          echo "---- ${{inputs.villano}} ----"
          