name: Reclutamiento de Agente

on: push

jobs:
  reporte-de-reclutamiento:
    runs-on: ubuntu-latest

    steps:
      - name: El agente se presenta
        run: echo "Hola, soy un agente de reclutamiento y estoy listo para ayudar en el proceso de selección de candidatos."

      - name: Reporte de identidad
        run: |
          echo "Nombre del agente: ${{github.actor}}"
          echo ""
          echo "Contexto de github"
          echo "Repositorio: ${{github.repository}}"
          echo "Operacion: ${{github.sha}}"
          echo "Metadata: ${{toJson(github)}}"
      - name: Capacidades de la gente
        run: |
          echo "Capacidades de la gente:"
          echo "Sistema operativo"
          uname -a
          echo "Habilidades técnicas"
          node --version
          npm --version
      - name: Reconocimiento del terreno
        run: |
          echo "Reconocimiento del terreno"